name: Upload Modpack to CurseForge

on:
  push:
    branches:
      - main

jobs:
  upload-curseforge:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          
      - name: Get version from pakku.json
        id: version
        run: |
          VERSION=$(jq -r '.version' pakku.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        
      - name: Build CurseForge Profile
        run: |
          java -jar pakku.jar export
        
      - name: Upload CurseForge Profile
        uses: henkelmax/upload-curseforge-modpack-action@v1.0.0
        with:
          api-token: ${{ secrets.CURSEFORGE_API_KEY }}
          project-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          modpack-path: build/curseforge/EpochX-${{ steps.version.outputs.version }}.zip
          modpack-server-path: build/serverpack/EpochX-${{ steps.version.outputs.version }}.zip
          display-name: "v${{ steps.version.outputs.version }}"
          release-type: "release"
          changelog: "Automated upload from GitHub Actions - ${{ github.sha }}"
